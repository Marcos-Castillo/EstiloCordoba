<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingresar | Estilo Córdoba</title>

    <!-- Bootstrap 5 (CDN). Si no carga, login.css mantiene el diseño completo. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <!-- Estilos propios del login -->
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-body">
    <main class="login-pagina">
      <!-- Panel izquierdo: identidad de la barbería -->
      <section class="login-marca" aria-label="Barbería Estilo Córdoba">
        <img
          src="img/barberia.png"
          alt="Barbería Estilo Córdoba: corte y afeitada. Agendá tu cita al (55) 1234-5678."
          width="400"
          height="482"
        />
      </section>

      <!-- Panel derecho: formulario de acceso -->
      <section class="login-acceso" aria-labelledby="titulo-login">
        <div class="login-tarjeta">
          <header class="login-cabecera">
            <h1 class="login-titulo" id="titulo-login">
              Bienvenido a Estilo Córdoba
            </h1>
            <p class="login-subtitulo">Sistema de gestión</p>
            <hr class="login-regla" />
            <p class="login-apoyo">Ingresá tus credenciales para continuar</p>
          </header>

          <form id="formLogin" method="post" action="#">
            <div class="login-campo">
              <label class="login-etiqueta" for="usuario">Usuario</label>
              <input
                type="text"
                class="login-control"
                id="usuario"
                name="usuario"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                required
              />
            </div>

            <div class="login-campo">
              <label class="login-etiqueta" for="contrasena">Contraseña</label>
              <input
                type="password"
                class="login-control"
                id="contrasena"
                name="contrasena"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="login-campo">
              <label class="login-etiqueta" for="rol">Perfil</label>
              <select class="login-control" id="rol" name="rol" required>
                <option value="">Seleccioná tu perfil</option>
                <option value="administrador">Administrador</option>
                <option value="barbero">Barbero</option>
              </select>
            </div>

            <!-- Mensajes de error o confirmación (los completa login.js) -->
            <div id="mensaje" role="alert" aria-live="polite"></div>

            <button type="submit" class="login-boton">INGRESAR</button>
          </form>

          <p class="login-pie">Acceso exclusivo al personal</p>
        </div>
      </section>
    </main>

    <!-- Lógica de autenticación existente (sin modificar) -->
    <script src="js/login.js"></script>
  </body>
</html>
