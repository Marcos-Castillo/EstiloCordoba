name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Validar HTML y JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar validaciones
        run: node .github/scripts/validar.mjs

      - name: Resumen
        if: always()
        run: echo "La publicación en GitHub Pages se realiza automáticamente desde la rama main."
